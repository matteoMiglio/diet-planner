name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: diet
          POSTGRES_PASSWORD: diet
          POSTGRES_DB: diet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diet -d diet_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CI: true
      TEST_DATABASE_URL: postgres://diet:diet@127.0.0.1:5432/diet_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker images (amd64 + arm64)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: App image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Backup image
        uses: docker/build-push-action@v7
        with:
          context: docker/backup
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max
