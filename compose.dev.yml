# Local development database. App and web run on the host with `pnpm dev`.
name: diet-planner-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: diet
      POSTGRES_PASSWORD: diet
      POSTGRES_DB: diet
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/dev/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U diet -d diet']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
